<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Вариант A — Слова из пыли</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500&family=Literata:opsz,wght@7..72,400&family=PT+Mono&display=swap" rel="stylesheet">
<style>
  /* Референс: Emotion Agency (Awwwards SOTD 22.10.2026): тёмная тема, WebGL-частицы, реакция на мышь. */
  :root { --bg: #0e0e0f; --ink: #f1efe9; --muted: #8b8882; --line: #262628; --accent: #d8473d; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { background: var(--bg); color: var(--ink); font-family: "Literata", serif; -webkit-font-smoothing: antialiased; display: flex; flex-direction: column; min-height: 100vh; }
  a { color: inherit; text-decoration: none; }
  .mono { font-family: "PT Mono", monospace; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  .head { display: flex; justify-content: space-between; align-items: center; padding: 22px 40px; border-bottom: 1px solid var(--line); }
  .head nav { display: flex; gap: 28px; color: var(--muted); }
  .head nav a:hover { color: var(--ink); }
  .buy { padding: 10px 16px; border: 1px solid var(--ink); }
  .buy:hover { background: var(--ink); color: var(--bg); }

  .stage { position: relative; flex: 1; cursor: crosshair; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; }

  .bottom { display: flex; justify-content: space-between; align-items: flex-end; padding: 20px 40px 32px; }
  .lead { font-size: 18px; line-height: 1.5; }
  .actions { display: flex; gap: 20px; align-items: center; }
  .btn { padding: 14px 24px; border-radius: 999px; background: var(--ink); color: var(--bg); }
  .btn:hover { background: var(--accent); color: var(--ink); }
  .link { text-decoration: underline; text-underline-offset: 3px; }
</style>
</head>
<body>
  <header class="head mono">
    <a href="../../">ВА · Вячеслав Алексейчиков</a>
    <nav><a href="#">Книги</a><a href="#">Стихи</a><a href="#">Об авторе</a></nav>
    <a class="buy" href="#">Купить книги</a>
  </header>

  <section class="stage" id="stage">
    <h1 class="sr-only">Кричащая тишина несказанных слов</h1>
    <canvas id="dust" aria-hidden="true"></canvas>
  </section>

  <div class="bottom">
    <p class="lead">О том, что чувствуют все, но говорят немногие.</p>
    <div class="actions mono"><a class="link" href="#">Читать стихи</a><a class="btn" href="#">Выбрать книгу</a></div>
  </div>

<script>
// Заголовок собран из тысяч пылинок: при загрузке они слетаются в слова, курсор их разметает — и они возвращаются.
const stage = document.getElementById("stage");
const cv = document.getElementById("dust");
const ctx = cv.getContext("2d");
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const STEP = 3;      // плотность: одна пылинка на 3×3 px
const RADIUS = 110;  // радиус «ветра» от курсора
let W, H, dpr, dots = [], mouse = null;

function build() {
  dpr = devicePixelRatio || 1;
  W = stage.clientWidth; H = stage.clientHeight;
  cv.width = W * dpr; cv.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  // Рисуем заголовок во временный холст и берём точки из пикселей
  const off = document.createElement("canvas");
  off.width = W; off.height = H;
  const o = off.getContext("2d");
  const size = Math.min(W / 8.4, H / 2.6);
  o.font = `500 ${size}px "Cormorant Garamond"`;
  o.textBaseline = "middle";
  o.textAlign = "center";
  o.fillStyle = "#fff";
  o.fillText("Кричащая тишина", W / 2, H / 2 - size * .5);
  const l2 = "несказанных ", l3 = "слов";
  const w2 = o.measureText(l2).width, w3 = o.measureText(l3).width;
  const x0 = W / 2 - (w2 + w3) / 2;
  o.textAlign = "left";
  o.fillText(l2, x0, H / 2 + size * .5);
  o.fillStyle = "#f00";
  o.fillText(l3, x0 + w2, H / 2 + size * .5);

  const data = o.getImageData(0, 0, W, H).data;
  const old = dots;
  dots = [];
  for (let y = 0; y < H; y += STEP) {
    for (let x = 0; x < W; x += STEP) {
      const i = (y * W + x) * 4;
      if (data[i + 3] > 128) {
        const red = data[i + 1] < 80;
        const p = old.length ? old[dots.length % old.length] : null;
        dots.push({
          ox: x, oy: y,
          x: p ? p.x : Math.random() * W, y: p ? p.y : Math.random() * H,
          vx: 0, vy: 0, red,
          a: .55 + Math.random() * .45
        });
      }
    }
  }
  if (reduce) dots.forEach((d) => { d.x = d.ox; d.y = d.oy; });
}

function frame() {
  ctx.clearRect(0, 0, W, H);
  for (const d of dots) {
    if (mouse) {
      const dx = d.x - mouse.x, dy = d.y - mouse.y, dist = Math.hypot(dx, dy);
      if (dist < RADIUS && dist > 0.1) {
        const f = (1 - dist / RADIUS) * 6;
        d.vx += (dx / dist) * f; d.vy += (dy / dist) * f;
      }
    }
    d.vx += (d.ox - d.x) * 0.045; d.vy += (d.oy - d.y) * 0.045; // пружина домой
    d.vx *= 0.86; d.vy *= 0.86;
    d.x += d.vx; d.y += d.vy;
    ctx.globalAlpha = d.a;
    ctx.fillStyle = d.red ? "#d8473d" : "#f1efe9";
    ctx.fillRect(d.x, d.y, 1.8, 1.8);
  }
  ctx.globalAlpha = 1;
  if (!reduce) requestAnimationFrame(frame);
}

stage.addEventListener("pointermove", (e) => { const b = stage.getBoundingClientRect(); mouse = { x: e.clientX - b.left, y: e.clientY - b.top }; });
stage.addEventListener("pointerleave", () => (mouse = null));
addEventListener("resize", () => { build(); if (reduce) frame(); });

document.fonts.load('500 100px "Cormorant Garamond"').then(() => { build(); frame(); });
</script>
</body>
</html>
