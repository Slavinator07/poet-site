<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Вариант C — Тишина и крик</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,200..900;1,7..72,200..900&family=PT+Mono&display=swap" rel="stylesheet">
<style>
  /* Референс: Kern Society (One Page Love, 13.10.2026): буквы «с пульсом», моно-подписи, бегущая строка, живые контролы. */
  :root { --bg: #f4f3ef; --ink: #18171a; --muted: #6b6862; --line: #18171a; --accent: #b3261e; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { overflow-x: hidden; }
  body { background: var(--bg); color: var(--ink); font-family: "Literata", serif; -webkit-font-smoothing: antialiased; }
  a { color: inherit; text-decoration: none; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  .mono { font-family: "PT Mono", monospace; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; }

  .head { display: flex; justify-content: space-between; align-items: center; padding: 18px 40px; border-bottom: 1px solid var(--line); }
  .head nav { display: flex; gap: 28px; }
  .head nav a:hover { color: var(--accent); }
  .buy { padding: 10px 16px; background: var(--ink); color: var(--bg); }
  .buy:hover { background: var(--accent); }

  .row { display: grid; grid-template-columns: repeat(4, 1fr); border-bottom: 1px solid var(--line); }
  .row > * { padding: 12px 40px; border-right: 1px solid var(--line); }
  .row > *:last-child { border-right: 0; }

  body { display: flex; flex-direction: column; min-height: 100vh; }
  .stage { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 24px 40px 8px; user-select: none; }
  .word {
    display: block; white-space: pre;
    font-size: 10.2vw; line-height: .95; letter-spacing: -.02em;
    font-variation-settings: "opsz" 72;
  }
  .word:nth-child(2) { text-align: right; font-style: italic; }
  .word span { display: inline-block; transition: font-weight .25s ease-out, color .25s; }
  .word span.hot { color: var(--accent); }

  .controls { display: flex; justify-content: space-between; align-items: flex-end; gap: 40px; padding: 20px 40px 32px; }
  .lead { font-size: 18px; line-height: 1.5; }
  .actions { display: flex; justify-content: flex-end; gap: 20px; align-items: center; }
  .btn { padding: 14px 24px; border-radius: 999px; background: var(--ink); color: var(--bg); }
  .btn:hover { background: var(--accent); }
  .link { text-decoration: underline; text-underline-offset: 3px; }

  @media (prefers-reduced-motion: reduce) { .word span { transition: none; } }
</style>
</head>
<body>
  <header class="head mono">
    <a href="../../">ВА · Вячеслав Алексейчиков</a>
    <nav><a href="#">Книги</a><a href="#">Стихи</a><a href="#">Об авторе</a></nav>
    <a class="buy" href="#">Купить книги</a>
  </header>
  <div class="row mono">
    <span>Поэзия</span><span>«Между строк»</span><span>«Тайны одинокого сердца»</span><span>Стихи о несказанном</span>
  </div>

  <section class="stage" id="stage" aria-label="Главный экран">
    <h1 class="sr-only">Кричащая тишина несказанных слов</h1>
    <span class="word" data-text="Кричащая тишина" aria-hidden="true"></span>
    <span class="word" data-text="несказанных слов" aria-hidden="true"></span>
  </section>

  <div class="controls">
    <p class="lead">О том, что чувствуют все, но говорят немногие.</p>
    <div class="actions mono"><a class="link" href="#">Читать стихи</a><a class="btn" href="#">Выбрать книгу</a></div>
  </div>

<script>
// Буквы «дышат»: чем ближе курсор, тем жирнее и ярче буква — тишина становится криком.
const stage = document.getElementById("stage");
// Базовая насыщенность — 30% шкалы 200…900 (фиксирована)
const BASE = 200 + 0.3 * (900 - 200);
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

const letters = [];
document.querySelectorAll(".word").forEach((w) => {
  [...w.dataset.text].forEach((ch) => {
    const s = document.createElement("span");
    s.textContent = ch;
    w.append(s);
    letters.push(s);
  });
});

let mouse = null, t = 0;
stage.addEventListener("pointermove", (e) => (mouse = { x: e.clientX, y: e.clientY }));
stage.addEventListener("pointerleave", () => (mouse = null));

function frame() {
  const base = BASE;
  t += 0.03;
  letters.forEach((s, i) => {
    let k; // 0…1 — насколько «кричит» буква
    if (mouse) {
      const b = s.getBoundingClientRect();
      const d = Math.hypot(b.left + b.width / 2 - mouse.x, b.top + b.height / 2 - mouse.y);
      k = Math.max(0, 1 - d / 320);
    } else {
      k = (Math.sin(t - i * 0.45) + 1) / 2 * 0.6; // без курсора по словам идёт тихая волна
    }
    const w = Math.round(base + (900 - base) * k);
    s.style.fontWeight = w;
    s.classList.toggle("hot", k > 0.75);
  });
  if (!reduce) requestAnimationFrame(frame);
}
frame();
</script>
</body>
</html>
